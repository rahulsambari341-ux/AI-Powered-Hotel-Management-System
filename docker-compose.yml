services:
  mysql:
    image: mysql:8.0
    container_name: hotel_ai_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
        - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Added in Phase 9.3. Backs conversation sessions and the Twilio audio
  # cache (see backend/app/storage.py) - required for safely running more
  # than one backend worker/process (Phase 9.2).
  redis:
    image: redis:7-alpine
    container_name: hotel_ai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Added in Phase 9.3. The FastAPI application itself, containerized.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hotel_ai_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside the docker network, services reach each other by service
      # name, not localhost - these override whatever .env has for local
      # (non-docker) development, so the same .env file works in both setups.
      MYSQL_HOST: mysql
      REDIS_URL: redis://redis:6379/0

volumes:
  mysql_data:
  redis_data:
